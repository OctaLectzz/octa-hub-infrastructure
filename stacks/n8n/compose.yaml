
services:
  postgres:
    container_name: n8n-postgres
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_NON_ROOT_USER: ${POSTGRES_NON_ROOT_USER:?Set POSTGRES_NON_ROOT_USER in .env}
      POSTGRES_NON_ROOT_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:?Set POSTGRES_NON_ROOT_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - /opt/octa/data/n8n-postgres:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -h localhost -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - n8n-backend

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Set N8N_VERSION in .env}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_POSTGRESDB_USER: ${POSTGRES_NON_ROOT_USER:?Set POSTGRES_NON_ROOT_USER in .env}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_NON_ROOT_PASSWORD:?Set POSTGRES_NON_ROOT_PASSWORD in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: n8n.octalectzz.my.id
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.octalectzz.my.id/
      N8N_WEBHOOK_URL: https://n8n.octalectzz.my.id/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN:?Set RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "5678:5678"
    volumes:
      - /opt/octa/data/n8n:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - octa-hub
      - n8n-backend

  n8n-runner:
    container_name: n8n-runner
    image: n8nio/runners:${N8N_VERSION:?Set N8N_VERSION in .env}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_AUTH_TOKEN: ${RUNNERS_AUTH_TOKEN:?Set RUNNERS_AUTH_TOKEN in .env}
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
    depends_on:
      - n8n
    networks:
      - n8n-backend

networks:
  octa-hub:
    external: true
    name: octa-hub

  n8n-backend:
    internal: true
